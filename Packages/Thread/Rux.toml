License = "MIT"
LicenseFile = "LICENSE.md"
Repository = "https://github.com/rux-lang/Rux"
Homepage = "https://rux-lang.dev/docs/api/thread"
ReadmeFile = "README.md"

[Dependencies]
Core = { Namespace = "Rux", Version = "0.1.0" }
FreeBSD = { Namespace = "Rux", Version = "0.1.0", TargetOS = ["FreeBSD"] }
Linux = { Namespace = "Rux", Version = "0.1.0", TargetOS = ["Linux"] }
macOS = { Namespace = "Rux", Version = "0.1.0", TargetOS = ["macOS"] }
Memory = { Namespace = "Rux", Version = "0.1.0" }
Windows = { Namespace = "Rux", Version = "0.1.0", TargetOS = ["Windows"] }
