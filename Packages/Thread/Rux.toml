[Manifest]
Version = 1
MinRux = "0.4.0"

[Package]
Namespace = "Rux"
Name = "Thread"
Version = "0.1.0"
Type = "SourceLibrary"
Description = "Threads of execution: starting, joining and detaching them, and asking about the current one"
Authors = ["Rux Contributors <info@rux-lang.dev>"]
