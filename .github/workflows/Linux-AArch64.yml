name: Linux AArch64

# Everything Linux AArch64 does, in the order it runs. CI.yml calls this
# workflow with the scope of the run, and Release.yml calls it with
# `extended`, so a release is built by exactly the steps CI verified.

on:
  workflow_call:
    inputs:
      scope:
        description: fast, full, or extended
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Restores the pinned Clang and ccache prefix from the cache, or packs it
      # from the pinned upstream assets and caches it, then exports the
      # compiler and ccache settings every later step uses.
      - name: Install the toolchain
        uses: ./.github/actions/toolchain
        with:
          target: linux-aarch64

      # The sha suffix makes the primary key always miss, so every saving run
      # writes back a cache warmer than the one it restored.
      - name: Restore the compilation cache
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: BuildCache/ccache
          key: ccache-linux-aarch64-${{ hashFiles('.github/Toolchains.env') }}-${{ github.sha }}
          restore-keys: ccache-linux-aarch64-${{ hashFiles('.github/Toolchains.env') }}-

      - name: Build
        run: sh .github/Scripts/Verify.sh --stage build

      # Saved before the tests so a slow or failing suite does not cost the next
      # run its warm cache, and on pushes only: a pull request rebuilds the
      # commit its branch push already cached.
      - name: Save the compilation cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: BuildCache/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Test
        run: sh .github/Scripts/Verify.sh --stage test

      - name: Check the runtime closure
        run: sh .github/Scripts/Verify.sh --stage closure

      - name: Upload the compiler
        uses: actions/upload-artifact@v7
        with:
          name: rux-linux-aarch64
          path: Bin/rux
          if-no-files-found: error
          retention-days: 7
