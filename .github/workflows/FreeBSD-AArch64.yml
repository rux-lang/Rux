name: FreeBSD AArch64

# Everything FreeBSD AArch64 does, in the order it runs. There is no hosted
# FreeBSD runner and no hosted runner accelerates an AArch64 guest, so the
# compiler is cross-compiled for freebsd-aarch64 inside the same KVM x86-64
# guest FreeBSD-x86_64.yml uses, with the guest's own Clang and lld against
# the AArch64 base system unpacked as a sysroot. It is then exercised in an
# AArch64 guest that runs under emulation and has no toolchain at all: a smoke
# in the full scope, the complete suites in the extended scope. The prepare
# script is identical to FreeBSD-x86_64.yml's so the two share one cached
# disk; Tests/Scripts/CI/Check.sh keeps them identical. CI.yml calls this
# workflow with the scope of the run, and Release.yml calls it with
# `extended`, so a release is built by exactly the steps CI verified.

on:
  workflow_call:
    inputs:
      scope:
        description: fast, full, or extended
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Every pinned version reaches the guest and the cache keys from one
      # file, so there is nothing to keep in sync.
      - name: Load the toolchain manifest
        run: grep -E '^[A-Z0-9_]+=' .github/Toolchains.env >> "$GITHUB_ENV"

      # The sha suffix makes the primary key always miss, so every saving run
      # writes back a cache warmer than the one it restored. The cache rides
      # into the guest with the workspace and comes back out with it.
      - name: Restore the compilation cache
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: BuildCache/ccache
          key: ccache-freebsd-aarch64-${{ hashFiles('.github/Toolchains.env') }}-${{ github.sha }}
          restore-keys: ccache-freebsd-aarch64-${{ hashFiles('.github/Toolchains.env') }}-

      # Boots the x86-64 guest, prepares it once, mirrors the workspace at the
      # same path inside it, and registers the `freebsd` shell the steps below
      # use; each of those steps is synced in before it runs and back out after.
      - name: Boot the FreeBSD guest
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        with:
          release: ${{ env.FREEBSD_VERSION }}
          arch: x86_64
          mem: 8192
          sync: rsync
          copyback: true
          custom-shell-name: freebsd
          cache-after-prepare: 'true'
          prepare: |
            set -eu
            export ASSUME_ALWAYS_YES=yes IGNORE_OSVERSION=yes
            mkdir -p /usr/local/etc/pkg/repos
            cat >/usr/local/etc/pkg/repos/FreeBSD.conf <<'REPO'
            FreeBSD-ports: {
              url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest",
              mirror_type: "srv",
              signature_type: "fingerprints",
              fingerprints: "/usr/share/keys/pkg",
              enabled: yes
            }
            REPO
            pkg update -f
            pkg install -y ${{ env.FREEBSD_PKG_LLVM }} cmake-core ninja ccache4 git-lite
            fetch -q -o /tmp/base.txz "${{ env.FREEBSD_BASE_URL }}/${{ env.FREEBSD_BASE_ASSET }}"
            [ "$(sha256 -q /tmp/base.txz)" = "${{ env.SHA256_FREEBSD_BASE_AARCH64 }}"
            mkdir -p /opt/sysroot/freebsd-aarch64
            tar -xf /tmp/base.txz -C /opt/sysroot/freebsd-aarch64 ./lib ./usr/lib ./usr/include ./usr/libdata
            rm -f /tmp/base.txz
          run: |
            freebsd-version
            clang++23 --version | head -1
            [ -f /opt/sysroot/freebsd-aarch64/usr/lib/libc.so ]

      # CMake honours CMAKE_TOOLCHAIN_FILE from the environment on the first
      # configure, so Run.sh needs no new option; the guest's Build/ is fresh.
      - name: Cross-build for freebsd-aarch64
        shell: freebsd {0}
        run: |
          set -eu
          . .github/Scripts/FreeBSDEnv.sh
          export CMAKE_TOOLCHAIN_FILE="$PWD/Compiler/CMake/Toolchains/FreeBSD-AArch64.cmake"
          export RUX_FREEBSD_AARCH64_SYSROOT=/opt/sysroot/freebsd-aarch64
          sh .github/Scripts/Verify.sh --stage build

      # Saved on pushes only: a pull request rebuilds the commit its branch
      # push already cached.
      - name: Save the compilation cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: BuildCache/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      # On the copied-back Bin/rux: the FreeBSD OS ABI at byte 7 and the
      # AArch64 machine at bytes 18 and 19, read the way the repository's own
      # verifiers read ELF headers.
      - name: Verify the compiler is a FreeBSD AArch64 ELF image
        run: |
          set -eu
          set -- $(od -An -tu1 -j 0 -N 8 Bin/rux)
          [ "$1 $2 $3 $4 $5 $6 $7 $8" = "127 69 76 70 2 1 1 9" ] ||
            { echo '::error::Bin/rux is not a little-endian FreeBSD ELF64 image'; exit 1; }
          set -- $(od -An -tu1 -j 18 -N 2 Bin/rux)
          [ "$1 $2" = "183 0" ] || { echo '::error::Bin/rux is not AArch64'; exit 1; }

      - name: Upload the compiler
        uses: actions/upload-artifact@v7
        with:
          name: rux-freebsd-aarch64
          path: Bin/rux
          if-no-files-found: error
          retention-days: 7

  # The cross-built compiler on a native AArch64 kernel, in a guest with no
  # toolchain installed. The guest runs under emulation on the x86-64 host,
  # several times slower than native, so the full scope runs a bounded smoke —
  # every workspace package checked, the native fixtures, the runtime closure,
  # and one language test built and launched — and the extended scope adds the
  # lint and the complete Rux test suite.
  test:
    name: Test
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ inputs.scope == 'extended' && 180 || 60 }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Load the toolchain manifest
        run: grep -E '^[A-Z0-9_]+=' .github/Toolchains.env >> "$GITHUB_ENV"

      - name: Download the compiler
        uses: actions/download-artifact@v7
        with:
          name: rux-freebsd-aarch64
          path: Bin

      - name: Run the compiler in an AArch64 guest
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        env:
          RUX_SCOPE: ${{ inputs.scope }}
        with:
          release: ${{ env.FREEBSD_VERSION }}
          arch: aarch64
          mem: 6144
          envs: 'RUX_SCOPE'
          sync: rsync
          copyback: false
          run: |
            set -eu
            chmod +x Bin/rux
            ./Bin/rux version
            ./Bin/rux check
            sh Tests/Native/FreeBSDAArch64/Verify.sh ./Bin/rux
            sh .github/Scripts/Verify.sh --stage closure
            ./Bin/rux --manifest Tests/Language/Arithmetic/Rux.toml run --release
            if [ "$RUX_SCOPE" = extended ]; then
              ./Bin/rux lint
              ./Bin/rux test --release --jobs 4
            fi
