name: Release

# Manual only. Pushing a tag never starts a release by itself, so there is
# nothing to race and nothing to cancel by accident. Every target is built by
# calling the same workflow CI runs for it, so a release cannot diverge from
# what was already verified.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the leading v (for example 0.4.0)
        type: string
        required: true
      dry-run:
        description: Build and package, but create no tag and no draft release
        type: boolean
        default: false

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify the version
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the version against the tree
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          case "$VERSION" in
          [0-9]*.[0-9]*.[0-9]*) ;;
          *) echo "::error::'$VERSION' is not a three-part version"; exit 1 ;;
          esac

          declared=$(sed -n 's/^project(Rux VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "$declared" != "$VERSION" ]; then
            echo "::error::CMakeLists.txt declares $declared, not $VERSION"
            exit 1
          fi
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists"
            exit 1
          fi

  # Each target workflow uploads its compiler as rux-<target>; the jobs below
  # download those. A dispatched run saves no compilation cache, so a release
  # never disturbs what the branches restore.
  linux-x86_64:
    needs: verify
    uses: ./.github/workflows/Linux-x86_64.yml
  linux-aarch64:
    needs: verify
    uses: ./.github/workflows/Linux-AArch64.yml
  macos-aarch64:
    needs: verify
    uses: ./.github/workflows/macOS-AArch64.yml
  macos-x86_64:
    needs: verify
    uses: ./.github/workflows/macOS-x86_64.yml
  windows-x86_64:
    needs: verify
    uses: ./.github/workflows/Windows-x86_64.yml
  windows-aarch64:
    needs: verify
    uses: ./.github/workflows/Windows-AArch64.yml
  freebsd-x86_64:
    needs: verify
    uses: ./.github/workflows/FreeBSD-x86_64.yml
  freebsd-aarch64:
    needs: verify
    uses: ./.github/workflows/FreeBSD-AArch64.yml

  publish:
    name: Publish
    needs:
      - linux-x86_64
      - linux-aarch64
      - macos-aarch64
      - macos-x86_64
      - windows-x86_64
      - windows-aarch64
      - freebsd-x86_64
      - freebsd-aarch64
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          path: Artifacts
          pattern: rux-*

      - name: Package every target
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          mkdir -p Release
          for directory in Artifacts/rux-*; do
            target=${directory#Artifacts/rux-}
            os=${target%-*}
            arch=${target##*-}
            case "$os" in
            windows)
              chmod +x "$directory/rux.exe"
              (cd "$directory" && zip -q "../../Release/rux-$os-$arch.zip" rux.exe)
              ;;
            *)
              chmod +x "$directory/rux"
              tar -czf "Release/rux-$os-$arch.tar.gz" -C "$directory" rux
              ;;
            esac
          done

          # The end-user installers resolve these names; keep them working.
          cp Release/rux-linux-x86_64.tar.gz Release/rux-linux.tar.gz
          cp Release/rux-macos-aarch64.tar.gz Release/rux-macos.tar.gz
          cp Release/rux-freebsd-x86_64.tar.gz Release/rux-freebsd.tar.gz
          cp Release/rux-windows-x86_64.zip Release/rux-windows.zip

      - name: Upload the release payload
        uses: actions/upload-artifact@v7
        with:
          name: release-payload
          path: Release
          if-no-files-found: error
          retention-days: 7

  installer:
    name: Windows installer
    needs: windows-x86_64
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: rux-windows-x86_64
          path: Bin
      - name: Build the MSI
        shell: pwsh
        run: ./Packaging/Windows/Msi/Build.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: release-msi
          path: Packaging/Windows/Msi/out/rux-windows.msi
          if-no-files-found: error
          retention-days: 7

  draft:
    name: Draft the release
    needs: [publish, installer]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          path: Release
          pattern: release-*
          merge-multiple: true

      # Checksums cover the MSI too, so they are written after both halves of
      # the payload have arrived. A dry run stops here, having produced and
      # checked exactly what a real release would publish.
      - name: Write the checksums
        run: |
          cd Release
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ inputs.version }}
          path: Release
          if-no-files-found: error
          retention-days: 14

      - name: Tag and draft
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" Release/* \
            --draft --title "Rux $VERSION" --notes-file /dev/null
