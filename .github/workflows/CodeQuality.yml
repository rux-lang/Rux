name: Code Quality

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

# Allow cancelling superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CMAKE_VERSION: "4.4.3"
  NINJA_VERSION: "1.13.2"

jobs:
  architecture:
    name: Architecture boundaries
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check component boundaries
        run: sh Run.sh policy
      - name: Check CI environment helpers
        run: sh .github/Scripts/Verify.sh infrastructure

  format:
    name: clang-format
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Match the LLVM major used by the build jobs so formatting is stable.
      - name: Restore Linux LLVM
        uses: ./.github/Actions/LinuxLLVM

      - name: Check formatting
        run: |
          find Compiler Tests/Unit \( -name '*.cpp' -o -name '*.h' \) -not -path '*ThirdParty*' -print0 \
            | xargs -0 clang-format-23 --dry-run -Werror

  tidy-shards:
    name: clang-tidy shard (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Restore Linux LLVM
        uses: ./.github/Actions/LinuxLLVM

      - name: Restore CMake, Ninja, and ccache
        uses: ./.github/Actions/BuildTools

      - name: Configure compilation database
        run: |
          cmake -S . -B Build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-23 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DRUX_WERROR=ON \
            -DRUX_BUILD_TESTS=ON \
            -DRUX_USE_PCH=OFF

      - name: Analyze C++ sources
        run: sh .github/Scripts/Run.sh tidy --index ${{ matrix.shard }}

  clang-tidy:
    name: clang-tidy
    if: ${{ always() }}
    needs: tidy-shards
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require every analysis shard
        env:
          RESULT: ${{ needs.tidy-shards.result }}
        run: test "$RESULT" = success
