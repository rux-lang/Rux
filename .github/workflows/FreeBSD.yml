name: FreeBSD

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

# Allow cancelling superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# GitHub has no native FreeBSD runner, so each job runs a FreeBSD VM (via
# QEMU) on an Ubuntu host. Build and Test use separate VMs. Transferred cross
# acceptance adds a third boundary: an x86-64 VM produces a target-only payload
# which a fresh AArch64 VM validates and launches without installing a compiler.
jobs:
  build-x86_64:
    name: Build (x86-64)
    # The host image supplies QEMU and the AArch64 guest firmware. The action's
    # own release matrix boots the emulated FreeBSD 15.1 AArch64 guest only on
    # ubuntu-24.04; on ubuntu-26.04 (QEMU 10.2, EDK2 2025.11) the guest never
    # brings up networking and the action gives up after two boot attempts.
    runs-on: ubuntu-26.04
    # The AArch64 VM is fully emulated, so compiling the compiler and complete
    # unit suite takes more than the default two-and-a-half-hour allowance.
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Restore C++ compilation cache
        id: compilation-cache
        uses: actions/cache/restore@v6
        with:
          path: BuildCache/ccache
          key: ccache-FreeBSD15.1-cmake4.4.3-x86_64-clang23-libcxx-Release-pch-off-${{ hashFiles('.github/CI/Environments.lock.json') }}-${{ github.sha }}
          restore-keys: ccache-FreeBSD15.1-cmake4.4.3-x86_64-clang23-libcxx-Release-pch-off-${{ hashFiles('.github/CI/Environments.lock.json') }}-

      - name: Build in FreeBSD VM
        uses: ./.github/Actions/FreeBSD
        with:
          arch: x86_64
          role: build
          run: |
            set -e
            cmake_bin=$(sh .github/Scripts/Verify.sh freebsd-cmake)
            export PATH="$cmake_bin:$PATH"
            export CCACHE_DIR="$PWD/BuildCache/ccache" CCACHE_MAXSIZE=768M CCACHE_COMPILERCHECK=content
            cmake --version
            cmake -S . -B Build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_COMPILER=clang++23 \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DRUX_USE_PCH=OFF \
              -DRUX_WERROR=ON \
              -DRUX_BUILD_TESTS=ON
            cmake --build Build --config Release --parallel
            sh Run.sh format --check --rux-executable ./Bin/rux
            ctest --test-dir Build --output-on-failure -C Release --parallel "$(sh Scripts/TestJobs.sh)" --no-tests=error

      - name: Save C++ compilation cache
        if: ${{ always() && !cancelled() && steps.compilation-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: BuildCache/ccache
          key: ${{ steps.compilation-cache.outputs.cache-primary-key }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: rux-freebsd-x86_64
          path: Bin/rux
          if-no-files-found: error
          retention-days: 7

  build-aarch64:
    name: Build (AArch64)
    # The host image supplies QEMU and the AArch64 guest firmware. The action's
    # own release matrix boots the emulated FreeBSD 15.1 AArch64 guest only on
    # ubuntu-24.04; on ubuntu-26.04 (QEMU 10.2, EDK2 2025.11) the guest never
    # brings up networking and the action gives up after two boot attempts.
    runs-on: ubuntu-24.04
    # The AArch64 VM is fully emulated, so compiling the compiler and complete
    # unit suite takes more than the default two-and-a-half-hour allowance.
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Restore C++ compilation cache
        id: compilation-cache
        uses: actions/cache/restore@v6
        with:
          path: BuildCache/ccache
          key: ccache-FreeBSD15.1-cmake4.4.3-aarch64-clang23-libcxx-Release-pch-off-${{ hashFiles('.github/CI/Environments.lock.json') }}-${{ github.sha }}
          restore-keys: ccache-FreeBSD15.1-cmake4.4.3-aarch64-clang23-libcxx-Release-pch-off-${{ hashFiles('.github/CI/Environments.lock.json') }}-

      - name: Build in FreeBSD VM
        uses: ./.github/Actions/FreeBSD
        with:
          arch: aarch64
          role: build
          run: |
            set -e
            cmake_bin=$(sh .github/Scripts/Verify.sh freebsd-cmake)
            export PATH="$cmake_bin:$PATH"
            export CCACHE_DIR="$PWD/BuildCache/ccache" CCACHE_MAXSIZE=768M CCACHE_COMPILERCHECK=content
            cmake --version
            cmake -S . -B Build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_COMPILER=clang++23 \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DRUX_USE_PCH=OFF \
              -DRUX_WERROR=ON \
              -DRUX_BUILD_TESTS=ON
            cmake --build Build --config Release --parallel
            sh Run.sh format --check --rux-executable ./Bin/rux
            ctest --test-dir Build --output-on-failure -C Release --parallel "$(sh Scripts/TestJobs.sh)" --no-tests=error

      - name: Save C++ compilation cache
        if: ${{ always() && !cancelled() && steps.compilation-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: BuildCache/ccache
          key: ${{ steps.compilation-cache.outputs.cache-primary-key }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: rux-freebsd-aarch64
          path: Bin/rux
          if-no-files-found: error
          retention-days: 7

  test-x86_64:
    name: Test (x86-64)
    needs: build-x86_64
    # Same host rule as the build matrix: only ubuntu-24.04 boots the emulated
    # AArch64 guest.
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download binary artifact
        uses: actions/download-artifact@v8
        with:
          name: rux-freebsd-x86_64
          path: Bin

      - name: Test in FreeBSD VM
        uses: ./.github/Actions/FreeBSD
        with:
          arch: x86_64
          role: runtime
          run: |
            set -e
            chmod +x Bin/rux
            ./Bin/rux check
            ./Bin/rux lint
            ./Bin/rux test --release --jobs "$(sh Scripts/TestJobs.sh)"
            if [ "x86_64" = aarch64 ]; then
              sh Tests/Native/FreeBSDAArch64/Verify.sh ./Bin/rux
            fi

  test-aarch64:
    name: Test (AArch64)
    needs: build-aarch64
    # Same host rule as the build matrix: only ubuntu-24.04 boots the emulated
    # AArch64 guest.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download binary artifact
        uses: actions/download-artifact@v8
        with:
          name: rux-freebsd-aarch64
          path: Bin

      - name: Test in FreeBSD VM
        uses: ./.github/Actions/FreeBSD
        with:
          arch: aarch64
          role: runtime
          run: |
            set -e
            chmod +x Bin/rux
            ./Bin/rux check
            ./Bin/rux lint
            ./Bin/rux test --release --jobs "$(sh Scripts/TestJobs.sh)"
            if [ "aarch64" = aarch64 ]; then
              sh Tests/Native/FreeBSDAArch64/Verify.sh ./Bin/rux
            fi

  cross-build:
    name: Cross payload (x86-64 compiler)
    needs: build-x86_64
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download x86-64 compiler
        uses: actions/download-artifact@v8
        with:
          name: rux-freebsd-x86_64
          path: Bin

      - name: Cross-build payload in FreeBSD x86-64 VM
        uses: ./.github/Actions/FreeBSD
        with:
          arch: x86_64
          role: runtime
          run: |
            set -e
            chmod +x Bin/rux
            sh Tests/Native/FreeBSDAArch64/BuildTransfer.sh ./Bin/rux FreeBSDAArch64Payload

      - name: Upload target-only payload
        uses: actions/upload-artifact@v7
        with:
          name: freebsd-x86_64-to-aarch64-runtime
          path: FreeBSDAArch64Payload
          if-no-files-found: error
          retention-days: 7

  cross-runtime:
    name: Cross runtime (transferred to AArch64)
    needs: cross-build
    # Boots an emulated AArch64 guest, so it needs the ubuntu-24.04 host too.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout verifier
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download target-only payload
        uses: actions/download-artifact@v8
        with:
          name: freebsd-x86_64-to-aarch64-runtime
          path: FreeBSDAArch64Payload

      - name: Run transferred bytes in fresh FreeBSD AArch64 VM
        uses: ./.github/Actions/FreeBSD
        with:
          arch: aarch64
          role: minimal
          run: |
            set -e
            sh Tests/Native/FreeBSDAArch64/VerifyTransfer.sh FreeBSDAArch64Payload

  acceptance:
    name: FreeBSD acceptance
    if: ${{ always() }}
    needs: [ test-x86_64, test-aarch64, cross-runtime ]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require native and transferred acceptance
        env:
          NATIVE_X64: ${{ needs.test-x86_64.result }}
          NATIVE_ARM64: ${{ needs.test-aarch64.result }}
          CROSS_RESULT: ${{ needs.cross-runtime.result }}
        run: |
          if [ "$NATIVE_X64" != success ] || [ "$NATIVE_ARM64" != success ] || [ "$CROSS_RESULT" != success ]; then
            echo "::error::FreeBSD acceptance failed: x86_64=$NATIVE_X64 aarch64=$NATIVE_ARM64 transferred=$CROSS_RESULT"
            exit 1
          fi
          echo "FreeBSD native and transferred acceptance passed."
