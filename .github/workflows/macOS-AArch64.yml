name: macOS AArch64

# Everything macOS AArch64 does, in the order it runs. Release.yml calls this
# workflow too, so a release is built by exactly the steps CI verified.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, dev]
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  workflow_call:

# A branch push and its pull request share one group so the same commit is never
# built twice. Runs on dev are left alone because they warm the caches every
# other branch restores, and a dispatched run is never cancelled because a
# release is one.
concurrency:
  group: macos-aarch64-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref_name != 'dev' && github.ref_name != 'main' }}

permissions:
  contents: read

jobs:
  build:
    name: macOS AArch64
    # Linux x86-64 is the fast lane and runs on every push; every other target
    # waits for something that can reach dev.
    if: ${{ github.event_name != 'push' || github.ref_name == 'dev' || github.ref_name == 'main' }}
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Every pinned version and checksum reaches later steps and cache keys
      # from one file, so there is nothing to keep in sync.
      - name: Load the toolchain manifest
        run: grep -E '^[A-Z0-9_]+=' .github/Toolchains.env >> "$GITHUB_ENV"

      # Restored here and saved by the post step on a miss.
      - name: Restore the toolchain
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/rux-toolchain
          key: toolchain-${{ env.TOOLCHAIN_REVISION }}-macos-aarch64

      - name: Install the toolchain
        run: sh .github/Scripts/SetupToolchain.sh --target macos-aarch64

      # The sha suffix makes the primary key always miss, so every run writes
      # back a cache warmer than the one it restored.
      - name: Restore the compilation cache
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: BuildCache/ccache
          key: ccache-macos-aarch64-${{ env.TOOLCHAIN_REVISION }}-${{ github.sha }}
          restore-keys: ccache-macos-aarch64-${{ env.TOOLCHAIN_REVISION }}-

      - name: Build
        run: sh .github/Scripts/Verify.sh --stage build

      # Saved before the tests so a slow or failing suite does not cost the next
      # run its warm cache, and on pushes only: a pull request rebuilds the
      # commit its branch push already cached.
      - name: Save the compilation cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: BuildCache/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Test
        run: sh .github/Scripts/Verify.sh --stage test

      - name: Check the runtime closure
        run: sh .github/Scripts/Verify.sh --stage closure

      - name: Run the native fixtures
        run: sh Tests/Native/MacOSAArch64/Verify.sh

      - name: Upload the compiler
        uses: actions/upload-artifact@v7
        with:
          name: rux-macos-aarch64
          path: Bin/rux
          if-no-files-found: error
          retention-days: 7
