name: Linux x86-64

# Everything Linux x86-64 does, in the order it runs. CI.yml calls it in every
# scope that builds anything, so it is the fast lane, and it is also the host
# that checks every cross target, because rux emits and links every target
# format in-process. Release.yml calls it too, so a release is built by exactly
# the steps CI verified.

on:
  workflow_call:
    inputs:
      scope:
        description: fast, full, or extended
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Restores the pinned Clang and ccache prefix from the cache, or packs it
      # from the pinned upstream assets and caches it, then exports the
      # compiler and ccache settings every later step uses.
      - name: Install the toolchain
        uses: ./.github/actions/toolchain
        with:
          target: linux-x86_64

      # The sha suffix makes the primary key always miss, so every saving run
      # writes back a cache warmer than the one it restored.
      - name: Restore the compilation cache
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: BuildCache/ccache
          key: ccache-linux-x86_64-${{ hashFiles('.github/Toolchains.env') }}-${{ github.sha }}
          restore-keys: ccache-linux-x86_64-${{ hashFiles('.github/Toolchains.env') }}-

      - name: Build
        run: sh .github/Scripts/Verify.sh --stage build

      # Saved before the tests so a slow or failing suite does not cost the next
      # run its warm cache, and on pushes only: a pull request rebuilds the
      # commit its branch push already cached.
      - name: Save the compilation cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: BuildCache/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Test
        run: sh .github/Scripts/Verify.sh --stage test

      - name: Check the runtime closure
        run: sh .github/Scripts/Verify.sh --stage closure

      # Rux formatting needs a built compiler, so it runs here rather than in
      # the quality job.
      - name: Check Rux formatting
        run: sh .github/Scripts/Verify.sh --stage format

      - name: Check every cross target
        run: |
          for target in freebsd-aarch64 freebsd-x86_64 linux-aarch64 macos-aarch64 \
                        macos-x86_64 windows-aarch64 windows-x86_64; do
            ./Bin/rux check --target "$target"
          done

      # A Linux host builds a FreeBSD AArch64 executable and static archive and
      # inspects their ELF identity without a sysroot or an emulator.
      - name: Cross-build FreeBSD AArch64 images and inspect them
        run: sh Tests/Native/FreeBSDAArch64/VerifyCross.sh ./Bin/rux

      # The same host builds a macOS executable and a dylib, then inspects the
      # Mach-O headers, the embedded code signature, and a deterministic
      # rebuild. It is the one place that proves a non-Mac host can target macOS.
      - name: Cross-build macOS AArch64 images and inspect them
        shell: pwsh
        run: ./Tests/Native/MacOSAArch64/VerifyCross.ps1 -Rux ./Bin/rux

      - name: Upload the compiler
        uses: actions/upload-artifact@v7
        with:
          name: rux-linux-x86_64
          path: Bin/rux
          if-no-files-found: error
          retention-days: 7
