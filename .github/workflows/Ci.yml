name: CI

# The host-independent checks and the required gate. Building is owned by the
# per-platform workflows, which call the same Build.yml and give each platform a
# status badge of its own; running the matrix here as well would build every
# target twice.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, dev]
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# Pushing again cancels the previous run, and a branch push and its pull request
# share one group so the same commit is never built twice. Runs on `dev` are left
# alone because they are what warms the caches every other branch restores.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'dev' && github.ref_name != 'main' }}

permissions:
  contents: read

jobs:
  plan:
    uses: ./.github/workflows/Plan.yml

  quality:
    name: Quality
    needs: plan
    if: ${{ needs.plan.outputs.docs-only != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Load the toolchain manifest
        run: grep -E '^[A-Z0-9_]+=' .github/Toolchains.env >> "$GITHUB_ENV"
      - name: Restore the toolchain
        id: toolchain
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/rux-toolchain
          key: toolchain-${{ env.TOOLCHAIN_REVISION }}-linux-x86_64
      - name: Install the toolchain
        run: sh .github/Scripts/SetupToolchain.sh --target linux-x86_64
      - name: Check component boundaries
        run: sh Run.sh policy
      - name: Check C++ formatting
        run: |
          find Compiler Tests/Unit \( -name '*.cpp' -o -name '*.h' \) -not -path '*ThirdParty*' -print0 |
            xargs -0 clang-format-23 --dry-run -Werror

  tidy:
    name: clang-tidy (shard ${{ matrix.shard }})
    needs: plan
    if: ${{ needs.plan.outputs.scope == 'full' && needs.plan.outputs.docs-only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Load the toolchain manifest
        run: grep -E '^[A-Z0-9_]+=' .github/Toolchains.env >> "$GITHUB_ENV"
      - name: Restore the toolchain
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/rux-toolchain
          key: toolchain-${{ env.TOOLCHAIN_REVISION }}-linux-x86_64
      - name: Install the toolchain
        run: sh .github/Scripts/SetupToolchain.sh --target linux-x86_64
      - name: Configure the compilation database
        run: |
          cmake -S . -B Build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DRUX_WERROR=ON -DRUX_BUILD_TESTS=ON -DRUX_USE_PCH=OFF
      - name: Analyze
        run: sh Run.sh tidy --shard-index ${{ matrix.shard }} --shard-count 3

  branch-policy:
    name: Use dev as the pull request target
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - name: Reject the target branch
        run: |
          echo '`main` is the release-promotion branch. Retarget this pull request at `dev`.' \
            >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # The single required check. `!cancelled()` rather than `always()` means
  # pressing Cancel ends the run immediately instead of leaving this job to
  # outlive it, and accepting `skipped` is what lets the fast lane and a
  # docs-only change pass without every target having run.
  ci:
    name: CI
    if: ${{ !cancelled() }}
    needs: [plan, quality, tidy, branch-policy]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require every selected job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          status=0
          for result in $RESULTS; do
            case "$result" in
            success | skipped) ;;
            *)
              echo "::error::a required job reported $result"
              status=1
              ;;
            esac
          done
          exit "$status"
