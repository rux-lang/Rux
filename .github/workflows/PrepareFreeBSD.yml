name: Prepare FreeBSD Images
on:
  workflow_dispatch:
    inputs:
      revision:
        description: New ci-tools-freebsd-* prerelease revision
        required: true
        type: string
      resume:
        description: Resume an existing draft checkpoint with the identical recipe
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: prepare-freebsd-${{ inputs.revision }}
  cancel-in-progress: false
jobs:
  initialize:
    if: github.repository == 'rux-lang/Rux' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Create or check the draft revision
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ inputs.revision }}
          RESUME: ${{ inputs.resume }}
          REPOSITORY: ${{ github.repository }}
        run: |
          [[ "$REVISION" =~ ^ci-tools-freebsd-[A-Za-z0-9._-]+$ ]] || exit 1
          if [ "$RESUME" = true ]; then
            test "$(gh release view "$REVISION" --repo "$REPOSITORY" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$REVISION" --repo "$REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --latest=false --title "$REVISION" --notes 'Prepared CI environments; not a Rux product release.'
          fi
  base:
    needs: initialize
    if: ${{ !inputs.resume }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    uses: ./.github/workflows/FreeBSDImagePhase.yml
    with:
      arch: ${{ matrix.arch }}
      revision: ${{ inputs.revision }}
      phase: base
  cmake-1:
    needs: [initialize, base]
    if: ${{ always() && needs.initialize.result == 'success' && (needs.base.result == 'success' || needs.base.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    uses: ./.github/workflows/FreeBSDImagePhase.yml
    with:
      arch: ${{ matrix.arch }}
      revision: ${{ inputs.revision }}
      phase: cmake
  cmake-2:
    needs: cmake-1
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    uses: ./.github/workflows/FreeBSDImagePhase.yml
    with:
      arch: ${{ matrix.arch }}
      revision: ${{ inputs.revision }}
      phase: cmake
  cmake-3:
    needs: cmake-2
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    uses: ./.github/workflows/FreeBSDImagePhase.yml
    with:
      arch: ${{ matrix.arch }}
      revision: ${{ inputs.revision }}
      phase: cmake
  cmake-4:
    needs: cmake-3
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    uses: ./.github/workflows/FreeBSDImagePhase.yml
    with:
      arch: ${{ matrix.arch }}
      revision: ${{ inputs.revision }}
      phase: cmake
  finalize-x86_64:
    needs: cmake-4
    uses: ./.github/workflows/FreeBSDImagePhase.yml
    with:
      arch: x86_64
      revision: ${{ inputs.revision }}
      phase: finalize
  finalize-aarch64:
    needs: finalize-x86_64
    uses: ./.github/workflows/FreeBSDImagePhase.yml
    with:
      arch: aarch64
      revision: ${{ inputs.revision }}
      phase: finalize
  publish:
    needs: finalize-aarch64
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Publish only the validated complete image set
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ inputs.revision }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release download "$REVISION" --repo "$REPOSITORY" --pattern 'freebsd-*.json' --dir manifests
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          environments = {}
          for path in Path('manifests').glob('*.json'):
              candidate = json.loads(path.read_text())
              assert candidate['validated'] is True
              environments.update(candidate['environments'])
          assert set(environments) == {'freebsd-build-x86_64', 'freebsd-build-aarch64', 'freebsd-runtime-x86_64', 'freebsd-runtime-aarch64', 'freebsd-minimal-aarch64'}
          Path('candidate.json').write_text(json.dumps({'validated': True, 'environments': environments}, indent=2) + '\n')
          PYTHON
          gh release upload "$REVISION" candidate.json --repo "$REPOSITORY"
          # Checkpoints are disposable and must not become long-lived public assets.
          gh release view "$REVISION" --repo "$REPOSITORY" --json assets --jq '.assets[].name' |
            while IFS= read -r asset; do
              case "$asset" in checkpoint-*|transfer.tar.gz) gh release delete-asset "$REVISION" "$asset" --repo "$REPOSITORY" --yes ;; esac
            done
          gh release edit "$REVISION" --repo "$REPOSITORY" --draft=false --prerelease --latest=false
          echo 'Download candidate.json and promote it with .github/CI/Environment.py after reviewing the validation logs.' >> "$GITHUB_STEP_SUMMARY"
