name: Linux

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

# Allow cancelling superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CMAKE_VERSION: "4.4.3"
  NINJA_VERSION: "1.13.2"
  CCACHE_DIR: ${{ github.workspace }}/BuildCache/ccache
  CCACHE_MAXSIZE: 768M
  CCACHE_COMPILERCHECK: content

jobs:
  build-x86_64:
    name: Build (x86-64)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Restore Linux LLVM
        uses: ./.github/Actions/LinuxLLVM

      - name: Restore CMake, Ninja, and ccache
        uses: ./.github/Actions/BuildTools

      - name: Identify compiler and SDK
        id: environment
        shell: pwsh
        run: ./.github/Scripts/Verify.ps1 -Check Environment -Compiler "clang++-23"

      - name: Restore C++ compilation cache
        id: compilation-cache
        uses: actions/cache/restore@v6
        with:
          path: BuildCache/ccache
          key: ccache-Linux26.04-x86_64-clang23-libstdcxx-Release-pch-off-${{ steps.environment.outputs.identity }}-${{ github.sha }}
          restore-keys: ccache-Linux26.04-x86_64-clang23-libstdcxx-Release-pch-off-${{ steps.environment.outputs.identity }}-

      - name: Configure and build
        run: |
          cmake -S . -B Build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-23 \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DRUX_USE_PCH=OFF \
            -DRUX_WERROR=ON \
            -DRUX_BUILD_TESTS=ON
          cmake --build Build --config Release --parallel

      - name: Save compilation cache before tests
        if: steps.compilation-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: BuildCache/ccache
          key: ${{ steps.compilation-cache.outputs.cache-primary-key }}

      - name: Unit tests
        run: ctest --test-dir Build --output-on-failure -C Release --parallel "$(sh Scripts/TestJobs.sh)" --no-tests=error

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: rux-linux-x86_64
          path: Bin/rux
          if-no-files-found: error
          retention-days: 7

  build-aarch64:
    name: Build (AArch64)
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Restore Linux LLVM
        uses: ./.github/Actions/LinuxLLVM

      - name: Restore CMake, Ninja, and ccache
        uses: ./.github/Actions/BuildTools

      - name: Identify compiler and SDK
        id: environment
        shell: pwsh
        run: ./.github/Scripts/Verify.ps1 -Check Environment -Compiler "clang++-23"

      - name: Restore C++ compilation cache
        id: compilation-cache
        uses: actions/cache/restore@v6
        with:
          path: BuildCache/ccache
          key: ccache-Linux26.04-aarch64-clang23-libstdcxx-Release-pch-off-${{ steps.environment.outputs.identity }}-${{ github.sha }}
          restore-keys: ccache-Linux26.04-aarch64-clang23-libstdcxx-Release-pch-off-${{ steps.environment.outputs.identity }}-

      - name: Configure and build
        run: |
          cmake -S . -B Build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-23 \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DRUX_USE_PCH=OFF \
            -DRUX_WERROR=ON \
            -DRUX_BUILD_TESTS=ON
          cmake --build Build --config Release --parallel

      - name: Save compilation cache before tests
        if: steps.compilation-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: BuildCache/ccache
          key: ${{ steps.compilation-cache.outputs.cache-primary-key }}

      - name: Unit tests
        run: ctest --test-dir Build --output-on-failure -C Release --parallel "$(sh Scripts/TestJobs.sh)" --no-tests=error

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: rux-linux-aarch64
          path: Bin/rux
          if-no-files-found: error
          retention-days: 7

  test-x86_64:
    name: Test (x86-64)
    needs: build-x86_64
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # AArch64 artifacts are encoded and linked in-process by the AArch64 back
    # end, so this job needs no Clang at all.
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download binary artifact
        uses: actions/download-artifact@v8
        with:
          name: rux-linux-x86_64
          path: Bin

      # Restore the executable bit (artifacts don't preserve permissions).
      - name: Make binary executable
        run: chmod +x Bin/rux

      - name: Check Rux formatting
        run: |
          set -e
          manifest_count=$(find Packages Tests -type f -name Rux.toml -print | wc -l | tr -d '[:space:]')
          find Packages Tests -type f -name Rux.toml -print | while IFS= read -r manifest; do
            ./Bin/rux --manifest "$manifest" fmt --check
          done
          printf 'Passed Rux formatting (%s packages)\n' "$manifest_count"

      - name: Verify Rux workspace
        run: |
          ./Bin/rux check
          ./Bin/rux lint
          ./Bin/rux test --release --jobs "$(sh Scripts/TestJobs.sh)"

  test-aarch64:
    name: Test (AArch64)
    needs: build-aarch64
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    # AArch64 artifacts are encoded and linked in-process by the AArch64 back
    # end, so this job needs no Clang at all.
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download binary artifact
        uses: actions/download-artifact@v8
        with:
          name: rux-linux-aarch64
          path: Bin

      # Restore the executable bit (artifacts don't preserve permissions).
      - name: Make binary executable
        run: chmod +x Bin/rux

      - name: Verify Rux workspace
        run: |
          ./Bin/rux check
          ./Bin/rux lint
          ./Bin/rux test --release --jobs "$(sh Scripts/TestJobs.sh)"

  cross:
    name: Cross (x86-64 host, AArch64 target)
    needs: build-x86_64
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download binary artifact
        uses: actions/download-artifact@v8
        with:
          name: rux-linux-x86_64
          path: Bin

      # Restore the executable bit (artifacts don't preserve permissions).
      - name: Make binary executable
        run: chmod +x Bin/rux

      - name: Build and inspect linux-aarch64 output
        run: |
          ./Bin/rux check --target linux-aarch64
          ./Bin/rux --manifest Tests/Language/Arithmetic/Rux.toml build --release --target linux-aarch64
          artifact=Bin/Tests/Language/Release/Linux/AArch64/Arithmetic
          set -- $(od -An -v -t u1 -N 20 "$artifact")
          test "$1" -eq 127 -a "$2" -eq 69 -a "$3" -eq 76 -a "$4" -eq 70
          shift 18
          test "$1" -eq 183 -a "$2" -eq 0

      - name: Build and inspect macos-aarch64 output
        shell: pwsh
        run: |
          ./Bin/rux check --target macos-aarch64
          ./Tests/Native/MacOSAArch64/VerifyCross.ps1 -Rux ./Bin/rux

      - name: Build and inspect freebsd-aarch64 output
        run: sh Tests/Native/FreeBSDAArch64/VerifyCross.sh ./Bin/rux
