name: macOS

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

# Allow cancelling superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CMAKE_VERSION: "4.4.3"
  NINJA_VERSION: "1.13.2"
  CCACHE_DIR: ${{ github.workspace }}/BuildCache/ccache
  CCACHE_MAXSIZE: 768M
  CCACHE_COMPILERCHECK: content

jobs:
  build-x86_64:
    name: Build (x86-64)
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Restore macOS LLVM
        id: llvm
        uses: ./.github/Actions/MacOSLLVM

      - name: Restore CMake, Ninja, and ccache
        uses: ./.github/Actions/BuildTools

      - name: Identify compiler and SDK
        id: environment
        shell: pwsh
        run: ./.github/Scripts/Verify.ps1 -Check Environment -Compiler "${{ steps.llvm.outputs.compiler }}"

      - name: Restore C++ compilation cache
        id: compilation-cache
        uses: actions/cache/restore@v6
        with:
          path: BuildCache/ccache
          key: ccache-macOS-x86_64-clang23-libcxx-Release-pch-off-${{ steps.environment.outputs.identity }}-${{ github.sha }}
          restore-keys: ccache-macOS-x86_64-clang23-libcxx-Release-pch-off-${{ steps.environment.outputs.identity }}-

      - name: Configure and build
        run: |
          cmake -S . -B Build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="${{ steps.llvm.outputs.compiler }}" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DRUX_USE_PCH=OFF \
            -DRUX_WERROR=ON \
            -DRUX_BUILD_TESTS=ON
          cmake --build Build --config Release --parallel

      - name: Save compilation cache before tests
        if: steps.compilation-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: BuildCache/ccache
          key: ${{ steps.compilation-cache.outputs.cache-primary-key }}

      - name: Unit tests
        run: ctest --test-dir Build --output-on-failure -C Release --parallel "$(sh Scripts/TestJobs.sh)" --no-tests=error

      - name: Upload binary artifact
        id: upload
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: rux-macos-x86_64
          path: Bin/rux
          if-no-files-found: error
          retention-days: 7

      # Hosted macOS runners intermittently fail CreateArtifact with DNS
      # errors (ENOTFOUND) and the action has no built-in retry, so pause
      # for the blip to clear and try once more. Overwrite in case the
      # first attempt created the artifact before failing.
      - name: Wait before upload retry
        if: steps.upload.outcome == 'failure'
        run: sleep 15

      - name: Upload binary artifact (retry)
        if: steps.upload.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: rux-macos-x86_64
          path: Bin/rux
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  build-aarch64:
    name: Build (AArch64)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Restore macOS LLVM
        id: llvm
        uses: ./.github/Actions/MacOSLLVM

      - name: Restore CMake, Ninja, and ccache
        uses: ./.github/Actions/BuildTools

      - name: Identify compiler and SDK
        id: environment
        shell: pwsh
        run: ./.github/Scripts/Verify.ps1 -Check Environment -Compiler "${{ steps.llvm.outputs.compiler }}"

      - name: Restore C++ compilation cache
        id: compilation-cache
        uses: actions/cache/restore@v6
        with:
          path: BuildCache/ccache
          key: ccache-macOS-aarch64-clang23-libcxx-Release-pch-off-${{ steps.environment.outputs.identity }}-${{ github.sha }}
          restore-keys: ccache-macOS-aarch64-clang23-libcxx-Release-pch-off-${{ steps.environment.outputs.identity }}-

      - name: Configure and build
        run: |
          cmake -S . -B Build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="${{ steps.llvm.outputs.compiler }}" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DRUX_USE_PCH=OFF \
            -DRUX_WERROR=ON \
            -DRUX_BUILD_TESTS=ON
          cmake --build Build --config Release --parallel

      - name: Save compilation cache before tests
        if: steps.compilation-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: BuildCache/ccache
          key: ${{ steps.compilation-cache.outputs.cache-primary-key }}

      - name: Unit tests
        run: ctest --test-dir Build --output-on-failure -C Release --parallel "$(sh Scripts/TestJobs.sh)" --no-tests=error

      - name: Upload binary artifact
        id: upload
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: rux-macos-aarch64
          path: Bin/rux
          if-no-files-found: error
          retention-days: 7

      # Hosted macOS runners intermittently fail CreateArtifact with DNS
      # errors (ENOTFOUND) and the action has no built-in retry, so pause
      # for the blip to clear and try once more. Overwrite in case the
      # first attempt created the artifact before failing.
      - name: Wait before upload retry
        if: steps.upload.outcome == 'failure'
        run: sleep 15

      - name: Upload binary artifact (retry)
        if: steps.upload.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: rux-macos-aarch64
          path: Bin/rux
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  test-x86_64:
    name: Test (x86-64)
    needs: build-x86_64
    runs-on: macos-26-intel
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download binary artifact
        uses: actions/download-artifact@v8
        with:
          name: rux-macos-x86_64
          path: Bin

      # Restore the executable bit (artifacts don't preserve permissions).
      - name: Make binary executable
        run: chmod +x Bin/rux

      - name: Verify Rux workspace
        run: |
          ./Bin/rux check
          ./Bin/rux lint

      - name: Run Rux tests
        run: ./Bin/rux test --release --jobs "$(sh Scripts/TestJobs.sh)"

  test-aarch64:
    name: Test (AArch64)
    needs: build-aarch64
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download binary artifact
        uses: actions/download-artifact@v8
        with:
          name: rux-macos-aarch64
          path: Bin

      # Restore the executable bit (artifacts don't preserve permissions).
      - name: Make binary executable
        run: chmod +x Bin/rux

      - name: Verify Rux workspace
        run: |
          ./Bin/rux check
          ./Bin/rux lint

      - name: Run Rux tests
        run: ./Bin/rux test --release --jobs "$(sh Scripts/TestJobs.sh)"

      - name: Run Apple Silicon native runtime fixtures
        run: sh Tests/Native/MacOSAArch64/Verify.sh ./Bin/rux

  cross:
    name: Cross (x86-64 compiler, AArch64 target)
    needs: build-x86_64
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download x86-64 compiler artifact
        uses: actions/download-artifact@v8
        with:
          name: rux-macos-x86_64
          path: Bin

      - name: Verify Rux workspace for macos-aarch64
        run: |
          chmod +x Bin/rux
          /usr/bin/arch -x86_64 ./Bin/rux check --target macos-aarch64
          /usr/bin/arch -x86_64 ./Bin/rux test --release --jobs "$(sh Scripts/TestJobs.sh)" --target macos-aarch64

      # Artifacts do not preserve executable permissions. VerifyRosetta also
      # checks that this is a thin x86-64 compiler before launching it through
      # Rosetta; every produced fixture is launched directly as ARM64.
      - name: Run Apple Silicon cross-compiler runtime fixtures
        run: sh Tests/Native/MacOSAArch64/VerifyRosetta.sh ./Bin/rux
