name: macOS

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

# Allow cancelling superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CMAKE_VERSION: "4.3.3"
  NINJA_VERSION: "1.13.2"

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            label: x86-64
            runner: macos-26-intel
            artifact: rux-macos-x86_64
          - arch: aarch64
            label: AArch64
            runner: macos-26
            artifact: rux-macos-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # macOS ships Apple Clang, which lags upstream and lacks full C++26
      # support, so install LLVM Clang 22 from Homebrew to match Linux. The
      # runner image ships with third-party taps Homebrew no longer trusts by
      # default; nothing here uses them, so drop them rather than trusting
      # them or silencing the check.
      # The image also ships llvm@20. Unlinking it is not enough: Homebrew
      # refuses to link a versioned formula while another version is
      # installed at all, so `brew install llvm@22` annotated every run with
      # a link warning. Nothing here uses llvm@20 and the runner is
      # discarded after the job, so remove it outright; --ignore-dependencies
      # keeps preinstalled formulae that name it from blocking the removal.
      - name: Install Clang 22
        run: |
          brew untap aws/tap || true
          if brew list --versions llvm@20 >/dev/null; then
            brew uninstall --ignore-dependencies llvm@20
          fi
          brew install llvm@22
          echo "$(brew --prefix llvm@22)/bin" >> "$GITHUB_PATH"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@v4.3.3
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
          ninjaVersion: ${{ env.NINJA_VERSION }}

      - name: Configure and build
        run: |
          cmake -S . -B Build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="$(brew --prefix llvm@22)/bin/clang++" \
            -DRUX_WERROR=ON \
            -DRUX_BUILD_TESTS=ON
          cmake --build Build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir Build --output-on-failure -C Release

      - name: Upload binary artifact
        id: upload
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: Bin/rux
          if-no-files-found: error
          retention-days: 7

      # Hosted macOS runners intermittently fail CreateArtifact with DNS
      # errors (ENOTFOUND) and the action has no built-in retry, so pause
      # for the blip to clear and try once more. Overwrite in case the
      # first attempt created the artifact before failing.
      - name: Wait before upload retry
        if: steps.upload.outcome == 'failure'
        run: sleep 15

      - name: Upload binary artifact (retry)
        if: steps.upload.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: Bin/rux
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  test:
    name: Test (${{ matrix.label }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            label: x86-64
            runner: macos-26-intel
            artifact: rux-macos-x86_64
          - arch: aarch64
            label: AArch64
            runner: macos-26
            artifact: rux-macos-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download binary artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: Bin

      # Restore the executable bit (artifacts don't preserve permissions).
      - name: Make binary executable
        run: chmod +x Bin/rux

      - name: Verify Rux workspace
        run: |
          ./Bin/rux check
          ./Bin/rux lint

      - name: Run Rux tests
        run: ./Bin/rux test --release

      - name: Run Apple Silicon native runtime fixtures
        if: matrix.arch == 'aarch64'
        run: sh Tests/Native/MacOSAArch64/Verify.sh ./Bin/rux

  cross:
    name: Cross (x86-64 compiler, AArch64 target)
    needs: build
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download x86-64 compiler artifact
        uses: actions/download-artifact@v8
        with:
          name: rux-macos-x86_64
          path: Bin

      - name: Verify Rux workspace for macos-aarch64
        run: |
          chmod +x Bin/rux
          /usr/bin/arch -x86_64 ./Bin/rux check --target macos-aarch64
          /usr/bin/arch -x86_64 ./Bin/rux test --release --target macos-aarch64

      # Artifacts do not preserve executable permissions. VerifyRosetta also
      # checks that this is a thin x86-64 compiler before launching it through
      # Rosetta; every produced fixture is launched directly as ARM64.
      - name: Run Apple Silicon cross-compiler runtime fixtures
        run: sh Tests/Native/MacOSAArch64/VerifyRosetta.sh ./Bin/rux
