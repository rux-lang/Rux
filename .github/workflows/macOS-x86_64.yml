name: macOS x86-64

# Everything macOS x86-64 does, in the order it runs. There is no Intel runner
# and no macOS x86-64 toolchain: LLVM publishes no macOS archive and Homebrew
# has no Intel bottle for macOS 26. The macOS SDK is universal, so the AArch64
# prefix on the AArch64 runner cross-builds the x86-64 compiler, and Rosetta
# runs it and its tests on the same machine. CI.yml calls this workflow with
# the scope of the run, and Release.yml calls it with `extended`, so a release
# is built by exactly the steps CI verified.

on:
  workflow_call:
    inputs:
      scope:
        description: fast, full, or extended
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The AArch64 prefix, shared with the macOS AArch64 workflow through one
      # cache entry.
      - name: Install the toolchain
        uses: ./.github/actions/toolchain
        with:
          target: macos-aarch64

      # The sha suffix makes the primary key always miss, so every saving run
      # writes back a cache warmer than the one it restored.
      - name: Restore the compilation cache
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: BuildCache/ccache
          key: ccache-macos-x86_64-${{ hashFiles('.github/Toolchains.env') }}-${{ github.sha }}
          restore-keys: ccache-macos-x86_64-${{ hashFiles('.github/Toolchains.env') }}-

      - name: Build for x86-64
        env:
          RUX_OSX_ARCHITECTURE: x86_64
        run: sh .github/Scripts/Verify.sh --stage build

      # Saved before the tests so a slow or failing suite does not cost the next
      # run its warm cache, and on pushes only: a pull request rebuilds the
      # commit its branch push already cached.
      - name: Save the compilation cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: BuildCache/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Test under Rosetta
        run: sh .github/Scripts/Verify.sh --stage test

      - name: Check the runtime closure
        run: sh .github/Scripts/Verify.sh --stage closure

      # The compiler built here is x86-64 and runs under Rosetta on this AArch64
      # host, which is exactly the translated-compiler boundary these fixtures
      # exist to check.
      - name: Run the fixtures under Rosetta
        run: sh Tests/Native/MacOSAArch64/VerifyRosetta.sh

      - name: Upload the compiler
        uses: actions/upload-artifact@v7
        with:
          name: rux-macos-x86_64
          path: Bin/rux
          if-no-files-found: error
          retention-days: 7
