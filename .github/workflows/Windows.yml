name: Windows

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

# Allow cancelling superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CMAKE_VERSION: "4.4.3"
  NINJA_VERSION: "1.13.2"
  CCACHE_DIR: ${{ github.workspace }}/BuildCache/ccache
  CCACHE_MAXSIZE: 768M
  CCACHE_COMPILERCHECK: content
  # Keep the pinned upstream toolchain separate from the runner toolchain.
  LLVM_ROOT: "C:/LLVM"

jobs:
  build-x86_64:
    name: Build (x86-64)
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Neither runner image satisfies the Clang 23.1 floor: windows-2025 ships
      # Clang 20 and windows-11-arm has only the Clang 19 bundled with Visual
      # Studio, so install the upstream release for the host architecture.
      - name: Restore Windows LLVM
        uses: ./.github/Actions/WindowsLLVM
        with:
          arch: x86_64


      - name: Restore CMake, Ninja, and ccache
        uses: ./.github/Actions/BuildTools

      # Initialize the bundled Visual Studio environment so Clang can find
      # the Windows SDK, CRT headers, and import libraries.
      - name: Identify compiler and SDK
        id: environment
        shell: pwsh
        run: ./.github/Scripts/Verify.ps1 -Check Environment -Compiler "C:/LLVM/bin/clang++.exe" -VsArch amd64

      - name: Restore C++ compilation cache
        id: compilation-cache
        uses: actions/cache/restore@v6
        with:
          path: BuildCache/ccache
          key: ccache-Windows-x86_64-clang23-libcmt-Release-pch-off-${{ steps.environment.outputs.identity }}-${{ github.sha }}
          restore-keys: ccache-Windows-x86_64-clang23-libcmt-Release-pch-off-${{ steps.environment.outputs.identity }}-

      - name: Configure and build
        shell: pwsh
        run: |
          ./.github/Scripts/Install.ps1 -Tool VsEnvironment -Arch amd64

          # An absolute path, because the developer environment above puts the
          # Visual Studio Clang on PATH ahead of the one installed here.
          cmake -S . -B Build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_COMPILER="${{ env.LLVM_ROOT }}/bin/clang++.exe" `
            -DCMAKE_CXX_COMPILER_TARGET=x86_64-pc-windows-msvc `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DRUX_USE_PCH=OFF `
            -DRUX_WERROR=ON `
            -DRUX_BUILD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build Build --config Release --parallel

      - name: Save compilation cache before tests
        if: steps.compilation-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: BuildCache/ccache
          key: ${{ steps.compilation-cache.outputs.cache-primary-key }}

      - name: Unit tests
        shell: pwsh
        run: |
          ./.github/Scripts/Install.ps1 -Tool VsEnvironment -Arch amd64
          ctest --test-dir Build --output-on-failure -C Release --parallel ([Math]::Max(1, [Math]::Min(4, [Environment]::ProcessorCount))) --no-tests=error

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: rux-windows-x86_64
          path: Bin/rux.exe
          if-no-files-found: error
          retention-days: 7

  build-aarch64:
    name: Build (AArch64)
    runs-on: windows-11-arm
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Neither runner image satisfies the Clang 23.1 floor: windows-2025 ships
      # Clang 20 and windows-11-arm has only the Clang 19 bundled with Visual
      # Studio, so install the upstream release for the host architecture.
      - name: Restore Windows LLVM
        uses: ./.github/Actions/WindowsLLVM
        with:
          arch: aarch64


      - name: Restore CMake, Ninja, and ccache
        uses: ./.github/Actions/BuildTools

      # Initialize the bundled Visual Studio environment so Clang can find
      # the Windows SDK, CRT headers, and import libraries.
      - name: Identify compiler and SDK
        id: environment
        shell: pwsh
        run: ./.github/Scripts/Verify.ps1 -Check Environment -Compiler "C:/LLVM/bin/clang++.exe" -VsArch arm64

      - name: Restore C++ compilation cache
        id: compilation-cache
        uses: actions/cache/restore@v6
        with:
          path: BuildCache/ccache
          key: ccache-Windows-aarch64-clang23-libcmt-Release-pch-off-${{ steps.environment.outputs.identity }}-${{ github.sha }}
          restore-keys: ccache-Windows-aarch64-clang23-libcmt-Release-pch-off-${{ steps.environment.outputs.identity }}-

      - name: Configure and build
        shell: pwsh
        run: |
          ./.github/Scripts/Install.ps1 -Tool VsEnvironment -Arch arm64

          # An absolute path, because the developer environment above puts the
          # Visual Studio Clang on PATH ahead of the one installed here.
          cmake -S . -B Build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_COMPILER="${{ env.LLVM_ROOT }}/bin/clang++.exe" `
            -DCMAKE_CXX_COMPILER_TARGET=aarch64-pc-windows-msvc `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DRUX_USE_PCH=OFF `
            -DRUX_WERROR=ON `
            -DRUX_BUILD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build Build --config Release --parallel

      - name: Save compilation cache before tests
        if: steps.compilation-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: BuildCache/ccache
          key: ${{ steps.compilation-cache.outputs.cache-primary-key }}

      - name: Unit tests
        shell: pwsh
        run: |
          ./.github/Scripts/Install.ps1 -Tool VsEnvironment -Arch arm64
          ctest --test-dir Build --output-on-failure -C Release --parallel ([Math]::Max(1, [Math]::Min(4, [Environment]::ProcessorCount))) --no-tests=error

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: rux-windows-aarch64
          path: Bin/rux.exe
          if-no-files-found: error
          retention-days: 7

  test-x86_64:
    name: Test (x86-64)
    needs: build-x86_64
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download binary artifact
        uses: actions/download-artifact@v8
        with:
          name: rux-windows-x86_64
          path: Bin

      - name: Verify Rux workspace
        shell: pwsh
        run: |
          ./.github/Scripts/Install.ps1 -Tool VsEnvironment -Arch amd64
          ./Bin/rux.exe check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./Bin/rux.exe lint

      - name: Run Rux tests
        shell: pwsh
        run: |
          ./.github/Scripts/Install.ps1 -Tool VsEnvironment -Arch amd64
          ./Bin/rux.exe test --release --jobs ([Math]::Max(1, [Math]::Min(4, [Environment]::ProcessorCount)))

  test-aarch64:
    name: Test (AArch64)
    needs: build-aarch64
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download binary artifact
        uses: actions/download-artifact@v8
        with:
          name: rux-windows-aarch64
          path: Bin

      - name: Verify Rux workspace
        shell: pwsh
        run: |
          ./.github/Scripts/Install.ps1 -Tool VsEnvironment -Arch arm64
          ./Bin/rux.exe check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./Bin/rux.exe lint

      - name: Run Rux tests
        shell: pwsh
        run: |
          ./.github/Scripts/Install.ps1 -Tool VsEnvironment -Arch arm64
          ./Bin/rux.exe test --release --jobs ([Math]::Max(1, [Math]::Min(4, [Environment]::ProcessorCount)))

      - name: Run Windows AArch64 native fixtures
        shell: pwsh
        run: |
          ./Tests/Native/WindowsAArch64ExitCode/Verify.ps1 -Rux ./Bin/rux.exe
          ./Tests/Native/WindowsAArch64Assert/Verify.ps1 -Rux ./Bin/rux.exe
          ./Tests/Native/WindowsAArch64Panic/Verify.ps1 -Rux ./Bin/rux.exe
          ./Tests/Native/WindowsAArch64Dll/Verify.ps1 -Rux ./Bin/rux.exe

  cross:
    name: Cross (x86-64 compiler, AArch64 target)
    needs: build-x86_64
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Windows-on-ARM translates this x86-64 compiler process. The compiler's
      # direct-execution predicate detects the native OS architecture and
      # launches its AArch64 output directly.
      - name: Download x86-64 compiler artifact
        uses: actions/download-artifact@v8
        with:
          name: rux-windows-x86_64
          path: Bin

      - name: Verify Rux workspace for windows-aarch64
        shell: pwsh
        run: |
          ./Bin/rux.exe check --target windows-aarch64
          ./Bin/rux.exe test --release --jobs ([Math]::Max(1, [Math]::Min(4, [Environment]::ProcessorCount))) --target windows-aarch64

      - name: Run Windows AArch64 cross fixtures
        shell: pwsh
        run: |
          ./Tests/Native/WindowsAArch64ExitCode/Verify.ps1 -Rux ./Bin/rux.exe
          ./Tests/Native/WindowsAArch64Assert/Verify.ps1 -Rux ./Bin/rux.exe
          ./Tests/Native/WindowsAArch64Panic/Verify.ps1 -Rux ./Bin/rux.exe
          ./Tests/Native/WindowsAArch64Dll/Verify.ps1 -Rux ./Bin/rux.exe

      - name: Build and inspect macos-aarch64 output
        shell: pwsh
        run: |
          ./Bin/rux.exe check --target macos-aarch64
          ./Tests/Native/MacOSAArch64/VerifyCross.ps1 -Rux ./Bin/rux.exe
