name: Windows x86-64

# Everything this target needs is here: its matrix entry and when it runs. The
# build itself is described once, in Build.yml.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, dev]
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# A branch push and its pull request share one group so the same commit is never
# built twice. Runs on dev are left alone because they warm the caches every
# other branch restores.
concurrency:
  group: windows-x86_64-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'dev' && github.ref_name != 'main' }}

permissions:
  contents: read

jobs:
  build:
    # Linux x86-64 is the fast lane and runs on every push; every other target
    # waits for something that can reach dev.
    if: ${{ github.event_name != 'push' || github.ref_name == 'dev' || github.ref_name == 'main' }}
    uses: ./.github/workflows/Build.yml
    with:
      targets: >-
        [{"target":"windows-x86_64","label":"Windows x86-64","family":"windows","runner":"windows-2025","timeout":30}]
      upload-artifact: true
      save-cache: ${{ github.event_name == 'push' }}

  # The x86-64 compiler running under the ARM64 host's emulation layer, proving
  # a translated compiler still produces working native output. macOS covers this
  # inside its own build job, because macos-x86_64 is already cross-built there.
  cross-emulated:
    name: Windows x86-64 under emulation
    needs: build
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: rux-windows-x86_64
          path: Bin
      - name: Run the translated compiler
        shell: pwsh
        run: |
          foreach ($fixture in 'ExitCode', 'Assert', 'Panic', 'StackProbe', 'Dll') {
            & "./Tests/Native/WindowsAArch64$fixture/Verify.ps1"
            if ($LASTEXITCODE -ne 0) { throw "WindowsAArch64$fixture failed" }
          }
