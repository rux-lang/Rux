name: Windows x86-64

# Everything Windows x86-64 does, in the order it runs: the native build and
# tests, then, in the extended scope, the same compiler running under the
# ARM64 host's emulation layer. CI.yml calls this workflow with the scope of
# the run, and Release.yml calls it with `extended`, so a release is built by
# exactly the steps CI verified.

on:
  workflow_call:
    inputs:
      scope:
        description: fast, full, or extended
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Restores the pinned Clang and ccache prefix from the cache, or packs it
      # from the pinned upstream assets and caches it, imports the Visual
      # Studio environment once, and exports everything every later step uses.
      - name: Install the toolchain
        uses: ./.github/actions/toolchain
        with:
          target: windows-x86_64

      # The sha suffix makes the primary key always miss, so every saving run
      # writes back a cache warmer than the one it restored.
      - name: Restore the compilation cache
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: BuildCache/ccache
          key: ccache-windows-x86_64-${{ hashFiles('.github/Toolchains.env') }}-${{ github.sha }}
          restore-keys: ccache-windows-x86_64-${{ hashFiles('.github/Toolchains.env') }}-

      - name: Build
        shell: pwsh
        run: ./.github/Scripts/Verify.ps1 -Stage build

      # Saved before the tests so a slow or failing suite does not cost the next
      # run its warm cache, and on pushes only: a pull request rebuilds the
      # commit its branch push already cached.
      - name: Save the compilation cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: BuildCache/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Test
        shell: pwsh
        run: ./.github/Scripts/Verify.ps1 -Stage test

      - name: Check the runtime closure
        shell: pwsh
        run: ./.github/Scripts/Verify.ps1 -Stage closure

      - name: Upload the compiler
        uses: actions/upload-artifact@v7
        with:
          name: rux-windows-x86_64
          path: Bin/rux.exe
          if-no-files-found: error
          retention-days: 7

  # The x86-64 compiler just built, running under the ARM64 host's emulation
  # layer. Nothing is compiled here: the compiler needs no toolchain, so the job
  # downloads it and drives it. It proves a translated compiler still produces
  # working output for its own architecture and for the host's. macOS covers
  # the same boundary inside its own build job, because macos-x86_64 is already
  # cross-built and run under Rosetta there. Extended scope only: it costs a
  # second runner after the build and proves nothing a pull request needs.
  emulated:
    name: Under emulation
    needs: build
    if: inputs.scope == 'extended'
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download the compiler
        uses: actions/download-artifact@v7
        with:
          name: rux-windows-x86_64
          path: Bin

      - name: Test the translated compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./Bin/rux.exe check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./Bin/rux.exe lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./Bin/rux.exe test --release --jobs 4

      # The translated compiler detects the native OS architecture and launches
      # its AArch64 output directly.
      - name: Test the AArch64 target
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./Bin/rux.exe check --target windows-aarch64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./Bin/rux.exe test --release --target windows-aarch64 --jobs 4

      # Each verifier throws on failure, which ends the step. $LASTEXITCODE is
      # not a verdict: the exit-code fixture deliberately leaves it at 73.
      - name: Run the AArch64 fixtures
        shell: pwsh
        run: |
          foreach ($fixture in 'ExitCode', 'Assert', 'Panic', 'StackProbe', 'Dll') {
            & "./Tests/Native/WindowsAArch64$fixture/Verify.ps1"
          }
          exit 0
