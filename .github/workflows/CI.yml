name: CI

# The one workflow every push, pull request and manual run starts with. It
# decides once how much verification the run gets, calls one reusable workflow
# per target with that decision, runs the host-independent checks itself, and
# owns the single required check, `CI`.
#
#   docs      only documentation changed: nothing builds
#   fast      a push to a topic branch: policy, formatting, Linux x86-64
#   full      a pull request: every target, clang-tidy, the FreeBSD AArch64 smoke
#   extended  pushes to dev and main, a dispatched run, and Release: full plus
#             everything that runs under emulation
#
# Release.yml calls the same target workflows with `extended`, so a release is
# built by exactly the steps CI verified.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, dev]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      scope:
        description: How much to verify
        type: choice
        options: [fast, full, extended]
        default: extended

# A branch push and its pull request share one group so the same commit is
# never built twice, and a newer push supersedes the run in flight, on dev too:
# the compilation cache is saved before the tests, so a superseded run has
# already warmed it. A dispatched run is never cancelled.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    outputs:
      scope: ${{ steps.resolve.outputs.scope }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Resolve the verification scope
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RUX_REQUESTED_SCOPE: ${{ inputs.scope }}
          RUX_EVENT_BEFORE: ${{ github.event.before }}
          RUX_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RUX_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          scope=$(sh .github/Scripts/Scope.sh resolve)
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Verification scope: **$scope**" >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Policy and formatting
    needs: scope
    if: needs.scope.outputs.scope != 'docs'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install the toolchain
        uses: ./.github/actions/toolchain
        with:
          target: linux-x86_64
      - name: Check component boundaries
        run: sh Run.sh policy
      - name: Check C++ formatting
        run: |
          find Compiler Tests/Unit \( -name '*.cpp' -o -name '*.h' \) -not -path '*ThirdParty*' -print0 |
            xargs -0 clang-format-23 --dry-run -Werror

  tidy:
    name: clang-tidy (shard ${{ matrix.shard }})
    needs: scope
    # clang-tidy is slow, so it waits for something that can reach dev.
    if: needs.scope.outputs.scope == 'full' || needs.scope.outputs.scope == 'extended'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install the toolchain
        uses: ./.github/actions/toolchain
        with:
          target: linux-x86_64
      # Configure only: `Run.sh tidy` needs the compilation database, and
      # `Run.sh build` would also compile everything. The flags mirror the
      # configure line in Run.sh with PCH off, the database clang-tidy can read.
      - name: Configure the compilation database
        run: |
          cmake -S . -B Build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DRUX_WERROR=ON -DRUX_BUILD_TESTS=ON -DRUX_USE_PCH=OFF
      - name: Analyze
        run: sh Run.sh tidy --shard-index ${{ matrix.shard }} --shard-count 3

  branch-policy:
    name: Use dev as the pull request target
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - name: Reject the target branch
        run: |
          echo '`main` is the release-promotion branch. Retarget this pull request at `dev`.' \
            >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # The fast lane runs in every scope that builds anything; it is also the
  # host that checks every cross target.
  linux-x86_64:
    name: Linux x86-64
    needs: scope
    if: needs.scope.outputs.scope != 'docs'
    uses: ./.github/workflows/Linux-x86_64.yml
    with:
      scope: ${{ needs.scope.outputs.scope }}

  # Every other target waits for something that can reach dev.
  linux-aarch64:
    name: Linux AArch64
    needs: scope
    if: needs.scope.outputs.scope == 'full' || needs.scope.outputs.scope == 'extended'
    uses: ./.github/workflows/Linux-AArch64.yml
    with:
      scope: ${{ needs.scope.outputs.scope }}

  macos-aarch64:
    name: macOS AArch64
    needs: scope
    if: needs.scope.outputs.scope == 'full' || needs.scope.outputs.scope == 'extended'
    uses: ./.github/workflows/macOS-AArch64.yml
    with:
      scope: ${{ needs.scope.outputs.scope }}

  macos-x86_64:
    name: macOS x86-64
    needs: scope
    if: needs.scope.outputs.scope == 'full' || needs.scope.outputs.scope == 'extended'
    uses: ./.github/workflows/macOS-x86_64.yml
    with:
      scope: ${{ needs.scope.outputs.scope }}

  windows-x86_64:
    name: Windows x86-64
    needs: scope
    if: needs.scope.outputs.scope == 'full' || needs.scope.outputs.scope == 'extended'
    uses: ./.github/workflows/Windows-x86_64.yml
    with:
      scope: ${{ needs.scope.outputs.scope }}

  windows-aarch64:
    name: Windows AArch64
    needs: scope
    if: needs.scope.outputs.scope == 'full' || needs.scope.outputs.scope == 'extended'
    uses: ./.github/workflows/Windows-AArch64.yml
    with:
      scope: ${{ needs.scope.outputs.scope }}

  freebsd-x86_64:
    name: FreeBSD x86-64
    needs: scope
    if: needs.scope.outputs.scope == 'full' || needs.scope.outputs.scope == 'extended'
    uses: ./.github/workflows/FreeBSD-x86_64.yml
    with:
      scope: ${{ needs.scope.outputs.scope }}

  freebsd-aarch64:
    name: FreeBSD AArch64
    needs: scope
    if: needs.scope.outputs.scope == 'full' || needs.scope.outputs.scope == 'extended'
    uses: ./.github/workflows/FreeBSD-AArch64.yml
    with:
      scope: ${{ needs.scope.outputs.scope }}

  # The single required check. `!cancelled()` rather than `always()` means
  # pressing Cancel ends the run immediately instead of leaving this job to
  # outlive it, and accepting `skipped` is what lets a docs-only change and the
  # fast lane pass without every target having run.
  ci:
    name: CI
    if: ${{ !cancelled() }}
    needs:
      - scope
      - quality
      - tidy
      - branch-policy
      - linux-x86_64
      - linux-aarch64
      - macos-aarch64
      - macos-x86_64
      - windows-x86_64
      - windows-aarch64
      - freebsd-x86_64
      - freebsd-aarch64
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require every selected job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          status=0
          for result in $RESULTS; do
            case "$result" in
            success | skipped) ;;
            *)
              echo "::error::a required job reported $result"
              status=1
              ;;
            esac
          done
          exit "$status"
