name: Cached Linux LLVM
description: Restore the LLVM package files and runtime closure without repeated package installation.
runs:
  using: composite
  steps:
    - uses: actions/cache/restore@v6
      id: cache
      with:
        path: ${{ runner.temp }}/rux-linux-tools
        key: llvm-v1-Linux26.04-${{ runner.arch }}-${{ hashFiles('.github/CI/Environments.lock.json', '.github/CI/Install/Linux.sh', '.github/CI/Verify/LLVM.sh') }}
    - if: steps.cache.outputs.cache-hit != 'true'
      uses: ./.github/Actions/NativeEnvironment
    - shell: bash
      run: sh .github/Scripts/Install.sh linux-llvm "$RUNNER_TEMP/rux-linux-tools"
    - uses: actions/cache/save@v6
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        path: ${{ runner.temp }}/rux-linux-tools
        key: ${{ steps.cache.outputs.cache-primary-key }}
