name: FreeBSD environment
description: Boot a checksum-verified prepared FreeBSD image without guest tool installation.
inputs:
  arch:
    description: Guest architecture
    required: true
  role:
    description: build, runtime, or minimal
    required: true
  run:
    description: POSIX shell commands in the repository root
    required: true
runs:
  using: composite
  steps:
    - id: environment
      shell: bash
      env:
        ENV_KEY: freebsd-${{ inputs.role }}-${{ inputs.arch }}
      run: sh .github/Scripts/Run.sh environment resolve --key "$ENV_KEY"
    - if: steps.environment.outputs.kind != 'qcow2'
      shell: bash
      run: |
        echo '::error::Publish Prepare Tools with FreeBSD selected and promote its candidate manifest before running FreeBSD CI.'
        exit 1
    - if: steps.environment.outputs.kind == 'qcow2'
      shell: bash
      run: |
        if ! command -v qemu-system-x86_64 >/dev/null || ! command -v qemu-system-aarch64 >/dev/null ||
           ! command -v zstd >/dev/null || ! command -v rsync >/dev/null ||
           [ ! -f /usr/share/AAVMF/AAVMF_CODE.fd ]; then
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-system-arm qemu-efi-aarch64 zstd rsync
        fi
        sudo chmod a+rw /dev/kvm 2>/dev/null || true
    - if: steps.environment.outputs.kind == 'qcow2'
      shell: bash
      env:
        VM_ARCH: ${{ inputs.arch }}
        VM_ROLE: ${{ inputs.role }}
        VM_COMMAND: ${{ inputs.run }}
      run: |
        mkdir -p BuildCache
        printf '%s\n' "$VM_COMMAND" > BuildCache/CiCommand.sh
        sh .github/Scripts/Run.sh freebsd --arch "$VM_ARCH" --role "$VM_ROLE" --script BuildCache/CiCommand.sh
    - if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: freebsd-logs-${{ inputs.role }}-${{ inputs.arch }}-${{ github.job }}
        path: ${{ runner.temp }}/freebsd-${{ inputs.role }}-${{ inputs.arch }}/vm/*.log
        if-no-files-found: ignore
        retention-days: 3
